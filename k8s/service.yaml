apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: production
  labels:
    app: webapp
    tier: frontend
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
spec:
  type: LoadBalancer
  selector:
    app: webapp
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      nodePort: null
  externalTrafficPolicy: Local
  sessionAffinity: None
  allocateLoadBalancerNodePorts: true
